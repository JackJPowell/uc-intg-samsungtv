version: 2
updates:
  # Keep pyproject.toml and uv.lock up to date together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Builds use requirements.txt; also check the lint dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "pyproject.toml"
      - "uv.lock"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
